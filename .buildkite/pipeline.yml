steps:
  - label: ":python: Run loremipsum.sentence()"
    commands:
      - echo "--- Creating venv"
      - /opt/homebrew/bin/python3 -m venv venv
      - source venv/bin/activate
      - echo "--- Installing py-lorem"
      - pip install .
      - echo "--- Running loremipsum.sentence"
      - python -c "import loremipsum; print(loremipsum.sentence(max_char=20))" > result.txt
      - cat result.txt
      - buildkite-agent annotate "Sentence: $(cat result.txt)"

  - label: ":python: Run loremipsum.paragraph()"
    if: "build.state == \"passed\""
    commands:
      - echo "--- Creating venv"
      - /opt/homebrew/bin/python3 -m venv venv
      - source venv/bin/activate
      - echo "--- Installing py-lorem"
      - pip install .
      - echo "--- Running loremipsum.paragraph"
      - python -c "import loremipsum; print(loremipsum.paragraph(max_char=100))" > result2.txt
      - cat result2.txt
      - buildkite-agent annotate "Paragraph: $(cat result2.txt)"
